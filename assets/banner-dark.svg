<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mohammad Sharafi, software engineer">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1b20"/><stop offset="1" stop-color="#0e0e11"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E88866" stop-opacity="0.28"/><stop offset="1" stop-color="#E88866" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
<pattern id="p" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff0d" stroke-width="1"/></pattern>
<style>
.t{font:800 64px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ffffff;letter-spacing:-1px}
.s{font:500 24px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#b9b9c4}
.c{font:400 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#E88866;opacity:.45}
.cur{animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.glow{animation:pulse 6s ease-in-out infinite;transform-origin:600px 160px}
@keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
</style>
</defs>
<rect width="1200" height="320" rx="20" fill="url(#g)"/>
<rect width="1200" height="320" rx="20" fill="url(#p)"/>
<g clip-path="url(#clip)"><rect x="-400" y="-100" width="220" height="520" fill="url(#sh)" transform="rotate(18 600 160)"><animate attributeName="x" values="-400;1600;1600" keyTimes="0;0.45;1" dur="7s" repeatCount="indefinite"/></rect></g>
<ellipse class="glow" cx="600" cy="160" rx="420" ry="190" fill="url(#glow)"/>
<text x="48" y="52" text-anchor="start" class="c">$ whoami</text><text x="1152" y="52" text-anchor="end" class="c">&gt; open source, measured</text><text x="48" y="286" text-anchor="start" class="c">$ git push origin main</text><text x="1152" y="286" text-anchor="end" class="c">// shipping in public</text>
<text x="600" y="168" text-anchor="middle" class="t">Mohammad Sharafi</text>
<text x="600" y="216" text-anchor="middle" class="s">Software engineer · backend systems, mobile apps, privacy-first AI<tspan class="cur" fill="#E88866"> ▍</tspan></text>
<rect x="540" y="236" width="120" height="4" rx="2" fill="#E88866"/>
</svg>